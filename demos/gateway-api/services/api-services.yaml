apiVersion: v1
kind: Service
metadata:
  name: api-service-v1
  namespace: api-team
spec:
  selector:
    app: api-service
    version: v1
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-v1
  namespace: api-team
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-service
      version: v1
  template:
    metadata:
      labels:
        app: api-service
        version: v1
    spec:
      containers:
      - name: api
        image: nginx:alpine
        ports:
        - containerPort: 8080
        env:
        - name: API_VERSION
          value: "v1"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-v2
  namespace: api-team
spec:
  selector:
    app: api-service
    version: v2
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-v2
  namespace: api-team
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-service
      version: v2
  template:
    metadata:
      labels:
        app: api-service
        version: v2
    spec:
      containers:
      - name: api
        image: nginx:alpine
        ports:
        - containerPort: 8080
        env:
        - name: API_VERSION
          value: "v2"
