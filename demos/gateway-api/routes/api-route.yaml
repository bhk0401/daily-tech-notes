apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: api-team
  labels:
    environment: production
spec:
  parentRefs:
  - name: ecommerce-gateway
    namespace: gateway-system
    sectionName: https
  hostnames:
  - api.ecommerce.example.com
  rules:
  # v1 API - stable version (90% traffic)
  - name: v1-stable
    matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - name: api-service-v1
      port: 8080
      weight: 90
    - name: api-service-v2
      port: 8080
      weight: 10
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-API-Version
          value: v1
  # v2 API - beta version (test users only)
  - name: v2-beta
    matches:
    - path:
        type: PathPrefix
        value: /v2
    - headers:
      - name: X-Beta-User
        value: "true"
    backendRefs:
    - name: api-service-v2
      port: 8080
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-API-Version
          value: v2
