apiVersion: v1
kind: Pod
metadata:
  name: trusted-pod
  namespace: default
  labels:
    app: test
spec:
  containers:
  - name: nginx
    image: docker.io/nginx:1.25
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: trusted-pod-internal
  namespace: default
  labels:
    app: test
spec:
  containers:
  - name: app
    image: registry.company.com/myapp:v1.0.0
    ports:
    - containerPort: 8080
