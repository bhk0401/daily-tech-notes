# Network Policies Demo - Zero Trust Microsegmentation
# 应用顺序：先创建命名空间和标签，再应用默认拒绝策略，最后应用具体策略

# 1. 创建示例命名空间
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    name: ecommerce
---
# 2. 创建共享服务命名空间（用于多租户示例）
apiVersion: v1
kind: Namespace
metadata:
  name: shared-services
  labels:
    name: shared-services
---
# 3. 创建监控命名空间
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
---
# 4. 创建 Ingress 命名空间
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    name: ingress-nginx
