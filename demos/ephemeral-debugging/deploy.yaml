# 示例应用：用于演示 Ephemeral Container 调试
apiVersion: v1
kind: Namespace
metadata:
  name: debug-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-demo
  namespace: debug-demo
  labels:
    app: debug-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debug-demo
  template:
    metadata:
      labels:
        app: debug-demo
    spec:
      containers:
      - name: app
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: log-volume
          mountPath: /var/log/nginx
        - name: data-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: log-volume
        emptyDir: {}
      - name: data-volume
        configMap:
          name: debug-demo-content
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-demo-content
  namespace: debug-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Debug Demo</title></head>
    <body>
      <h1>Ephemeral Container Debug Demo</h1>
      <p>Use kubectl debug to investigate this Pod!</p>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: debug-demo
  namespace: debug-demo
spec:
  selector:
    app: debug-demo
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
