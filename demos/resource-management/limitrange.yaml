# LimitRange - 命名空间默认资源限制
# 避免 BestEffort Pod，提供合理的默认配置

apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: resource-demo
spec:
  limits:
  - type: Container
    # 默认值（不指定 resources 时使用）
    default:
      cpu: "500m"
      memory: "512Mi"
    # 默认请求值
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    # 最小值 - 防止配置过小
    min:
      cpu: "50m"
      memory: "64Mi"
    # 最大值 - 防止单个容器占用过多
    max:
      cpu: "2000m"
      memory: "4Gi"
    # maxLimitRequestRatio - 限制超卖比例（可选）
    # maxLimitRequestRatio:
    #   cpu: 4      # limits 最多是 requests 的 4 倍
    #   memory: 2   # limits 最多是 requests 的 2 倍
