# ResourceQuota - 命名空间资源配额
# 控制命名空间的总资源消耗

apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: resource-demo
spec:
  hard:
    # 总资源限制
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    
    # Pod 数量限制
    pods: "50"
    
    # 按 QoS Class 限制（可选）
    # pods: "50"                    # 总 Pod 数
    # persistentvolumeclaims: "10"  # PVC 数量
    # services: "20"                # Service 数量
    # secrets: "50"                 # Secret 数量
    # configmaps: "50"              # ConfigMap 数量

---
# 查看配额使用情况
# kubectl describe resourcequota -n resource-demo
#
# 输出示例：
# Name:         production-quota
# Namespace:    resource-demo
# Resource      Used    Hard
# --------      ----    ----
# limits.cpu    5000m   20
# limits.memory 10Gi    40Gi
# pods          15      50
