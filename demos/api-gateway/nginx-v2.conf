server {
    listen 80;
    server_name localhost;

    location / {
        add_header X-Service-Version "v2" always;
        add_header X-Request-Id "$request_id" always;
        add_header X-New-Feature "enabled" always;
        return 200 '{"service": "user-service", "version": "v2", "timestamp": "$time_iso8601", "new_feature": true}';
        default_type application/json;
    }
}
