server {
    listen 80;
    server_name localhost;

    location / {
        add_header X-Service-Version "v1" always;
        add_header X-Request-Id "$request_id" always;
        return 200 '{"service": "user-service", "version": "v1", "timestamp": "$time_iso8601"}';
        default_type application/json;
    }
}
